name: CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image namespace
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backEnd/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/zz-blog-backend:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/zz-blog-backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Resolve frontend build args
        id: fe
        run: |
          API_BASE="${{ vars.NEXT_PUBLIC_API_BASE_URL }}"
          SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL }}"
          echo "api_base=${API_BASE:-http://localhost:4000/api/v1}" >> "$GITHUB_OUTPUT"
          echo "site_url=${SITE_URL:-http://localhost:3000}" >> "$GITHUB_OUTPUT"

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontEnd/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ steps.fe.outputs.api_base }}
            NEXT_PUBLIC_SITE_URL=${{ steps.fe.outputs.site_url }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/zz-blog-frontend:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/zz-blog-frontend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
