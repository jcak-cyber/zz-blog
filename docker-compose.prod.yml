# 生产镜像部署（CD 推 GHCR → 服务器经国内镜像加速拉取）
# .env 可设：GHCR_REGISTRY=ghcr.m.daocloud.io（默认）、GHCR_OWNER、IMAGE_TAG

services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zzblog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zzblog}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    # 默认走 DaoCloud 对 ghcr.io 的加速；官方源可设 GHCR_REGISTRY=ghcr.io
    image: ${GHCR_REGISTRY:-ghcr.m.daocloud.io}/${GHCR_OWNER:-jcak-cyber}/zz-blog-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zzblog}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zzblog}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      IMPORT_TOKEN: ${IMPORT_TOKEN:?set IMPORT_TOKEN}
      UPLOAD_DIR: uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: 4000
      NODE_ENV: production
    ports:
      - '${BACKEND_PORT:-4000}:4000'
    volumes:
      - uploads:/app/apps/backEnd/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${GHCR_REGISTRY:-ghcr.m.daocloud.io}/${GHCR_OWNER:-jcak-cyber}/zz-blog-frontend:${IMAGE_TAG:-latest}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      BACKEND_URL: http://backend:4000
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
