services:
  # 说明：本文件既用于「本机只起 Postgres」，也用于服务器 CD 的源码构建部署（DEPLOY_MODE=build）。
  # 本机开发前后端请用 pnpm dev:*，不要用本文件的 frontend/backend 当开发热更新。
  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zzblog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zzblog}
      POSTGRES_DB: ${POSTGRES_DB:-zzblog}
    # 只绑本机，避免数据库端口对公网暴露
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backEnd/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zzblog}:${POSTGRES_PASSWORD:-zzblog}@postgres:5432/${POSTGRES_DB:-zzblog}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      IMPORT_TOKEN: ${IMPORT_TOKEN:?set IMPORT_TOKEN in .env}
      UPLOAD_DIR: uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # 目前用 http://公网IP 访问时必须为 false；上 HTTPS 后再改为 true
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: 4000
      NODE_ENV: production
    ports:
      - '4000:4000'
    volumes:
      - uploads:/app/apps/backEnd/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontEnd/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        BACKEND_URL: http://backend:4000
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      BACKEND_URL: http://backend:4000
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - '3000:3000'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
